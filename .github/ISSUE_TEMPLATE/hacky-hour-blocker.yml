name: Hacky-hour blocker
description: Submit a specific blocker or question for a hacky-hour session.
title: "[Topic] Brief description of your blocker"
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit

        Hacky hours are for *I'm stuck and want help unsticking.*
        Aim to fill this in within 3–5 minutes. Concrete blockers
        get better answers than vague ones, but don't let polish
        stop you submitting.

        Issues submitted at least 24 hours before the session are
        most likely to be picked for the group discussion. Later
        submissions still get seen in the open-floor segment.

  - type: checkboxes
    id: self-help-first
    attributes:
      label: Self-help first (please confirm both)
      description: |
        Hacky hours are for unsticking after self-help has run its
        course — *for any kind of blocker, not only technical ones*.
        Whether you're stuck on a Python error, a synthesis paragraph,
        a research question, or a Zotero workflow: try the learning
        prompt and something concrete first, then bring us what you
        got stuck on after that.
      options:
        - label: I consulted the class learning prompt (`prompts/learning-prompt.md`) or another LLM and worked through what it suggested
          required: true
        - label: I tried something concrete — drafting, sketching, searching, coding, configuring, reading, or whatever the blocker called for — and made it as far as I could on my own
          required: true

  - type: dropdown
    id: week
    attributes:
      label: Which week is this for?
      description: Used for triage and end-of-semester reflection.
      options:
        - Week 9 (5–6 May)
        - Week 10 (12–13 May)
        - Week 11 (19–20 May)
        - Week 12 (26–27 May)
        - Not sure — instructor can assign
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Which session?
      description: Pick the session where you'd like this question discussed.
      options:
        - Week 9 Hour 2 — Python for humanities (foundation)
        - Week 10 Hour 1 — Python NLP + APIs
        - Week 10 Hour 2 — Zotero + Voyant
        - Week 11 Hour 1 — Multimodal / Qualitative coding
        - Week 11 Hour 2 — Discussion + PICO clinic (prefer Canvas for this one)
        - Week 12 — Final PICO presentation prep
        - Not sure — instructor can assign
    validations:
      required: true

  - type: dropdown
    id: assessment
    attributes:
      label: Which assessment is this connected to?
      description: Helps us see whether class time is meeting A3 needs.
      options:
        - Assessment 3 (paper)
        - Final PICO presentation
        - Other / general skill-building
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: The primary topic this blocker relates to.
      options:
        - Python (scripting, pandas, basics)
        - Python NLP (NLTK, spaCy, text analysis)
        - APIs (authentication, requests, rate limits)
        - Zotero (references, group libraries)
        - Voyant Tools (text analysis, no-code)
        - Multimodal / video analysis
        - Qualitative coding / thematic analysis
        - Literature review / synthesis
        - Discussion section writing
        - PICO presentation preparation
        - Web scraping / data collection
        - VS Code / Copilot
        - Git / GitHub
        - Other — describe below
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
      description: One or two sentences on the bigger task this blocker is part of.
      placeholder: |
        I'm trying to get my Assessment 3 paper's literature review
        section into a working draft.
    validations:
      required: true

  - type: textarea
    id: what-you-tried
    attributes:
      label: What you've tried so far
      description: |
        A short list or paragraph — so we don't suggest things
        you've already tested. Paste any error messages in a
        fenced code block (three backticks before and after).
      placeholder: |
        - I have a list of 12 sources and drafted the
          gap-and-positioning move.
        - I tried grouping sources by method, then by theme.
        - The synthesis paragraphs aren't connecting.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: where-stuck
    attributes:
      label: Where you're stuck
      description: |
        The specific point at which progress halted. The more
        concrete, the better.
      placeholder: |
        I can't tell if my synthesis paragraphs are showing the
        gap clearly, or if I'm just summarising sources one after
        another.
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: help-kind
    attributes:
      label: What kind of help do you want?
      description: Helps with triage and pacing during the session.
      options:
        - Quick advice (10 minutes)
        - Pair through it together (~30 minutes)
        - Debugging or troubleshooting (technical)
        - Orientation — where do I even start
        - Other (describe in the box below)
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else we should know?
      description: |
        Optional. Deadline pressure, related context, links to
        a draft or notebook, or anything else that would help.
      placeholder: "This is blocking my A3 introduction — I'd like to resolve it before Week 11."
    validations:
      required: false
